# Re-runs the music catalog unit tests and validates music/catalog.json.
# There is no production build for this static site. This job does not deploy.

name: Music catalog checks

on:
  pull_request:
    paths:
      - "music/catalog.json"
      - "scripts/music_catalog/**"
      - ".github/workflows/music-catalog-checks.yml"
  push:
    paths:
      - "music/catalog.json"
      - "scripts/music_catalog/**"
      - ".github/workflows/music-catalog-checks.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: test
        run: bash scripts/music_catalog/run_checks.sh
