name: Update YouTube feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest videos
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          url = "https://www.youtube.com/feeds/videos.xml?channel_id=UCpGXjtF4LLnHf9ES3fNwSQQ"
          req = urllib.request.Request(url, headers={"User-Agent": "FerrousLionSite/1.0"})
          xml = urllib.request.urlopen(req, timeout=20).read().decode("utf-8")

          def dec(s):
              return (s.replace("\u0026amp;", "\u0026")
                      .replace("\u0026quot;", "\u0022")
                      .replace("\u0026#39;", "\u0027")
                      .replace("\u0026apos;", "\u0027"))

          videos = []
          for e in xml.split("<entry>")[1:]:
              vid = re.search(r"<yt:videoId>([^<]+)", e)
              title = re.search(r"<media:title>([^<]*)", e)
              pub = re.search(r"<published>([^<]+)", e)
              views = re.search(r'views="(\d+)"', e)
              href = re.search(r'<link rel="alternate" href="([^"]+)"', e)
              if not (vid and title and pub):
                  continue
              t = dec(title.group(1))
              v = int(views.group(1) if views else 0)
              if re.search(r"live stream", t, re.I) and v == 0:
                  continue
              h = href.group(1) if href else f"https://www.youtube.com/watch?v={vid.group(1)}"
              videos.append({
                  "id": vid.group(1),
                  "title": t,
                  "url": h,
                  "thumbnail": f"https://i.ytimg.com/vi/{vid.group(1)}/hqdefault.jpg",
                  "published": pub.group(1),
                  "views": v,
                  "isShort": "/shorts/" in h,
              })
              if len(videos) >= 6:
                  break
          open("videos.json", "w").write(json.dumps(videos, indent=2) + "\n")
          print(f"wrote {len(videos)} videos")
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git diff --cached --quiet || git commit -m "Refresh latest YouTube videos"
          git push
